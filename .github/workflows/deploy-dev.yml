name: Deploy development

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Exact validated commit SHA
        required: true
      phase:
        description: Guarded development operation
        required: true
        type: choice
        options:
          - preflight
          - runtime
          - mapping

permissions:
  contents: read

concurrency:
  group: momi-symphony-development
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.commit == github.sha
    environment: development
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Fail closed unless the pinned development project is selected
        run: test "$SUPABASE_DEV_PROJECT_REF" = "xtbraqnlskmqxinjxxdn"
        env:
          SUPABASE_DEV_PROJECT_REF: ${{ vars.SUPABASE_DEV_PROJECT_REF }}
      - name: Link the pinned project for migration phases
        if: inputs.phase != 'runtime'
        run: |
          unset SUPABASE_DB_PASSWORD PGPASSWORD
          pnpm exec supabase link --project-ref "$SUPABASE_DEV_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DEV_PROJECT_REF: ${{ vars.SUPABASE_DEV_PROJECT_REF }}
      - name: Prove the migration plan without applying it
        if: inputs.phase != 'runtime'
        run: |
          unset SUPABASE_DB_PASSWORD PGPASSWORD
          pnpm exec supabase db push --linked --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Apply the mapping only after the host cutover
        if: inputs.phase == 'mapping'
        run: |
          unset SUPABASE_DB_PASSWORD PGPASSWORD
          pnpm exec supabase db push --linked
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      - name: Deploy the Linear webhook runtime
        if: inputs.phase == 'runtime'
        run: pnpm exec supabase functions deploy momi-agent-control-linear-webhook-v1 --project-ref "$SUPABASE_DEV_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DEV_PROJECT_REF: ${{ vars.SUPABASE_DEV_PROJECT_REF }}
      - name: Deploy the dispatch runtime
        if: inputs.phase == 'runtime'
        run: pnpm exec supabase functions deploy momi-agent-control-dispatch-v1 --project-ref "$SUPABASE_DEV_PROJECT_REF"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DEV_PROJECT_REF: ${{ vars.SUPABASE_DEV_PROJECT_REF }}
